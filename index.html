<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Asterlite" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/asterlite/manifest.webmanifest" />
    <link rel="icon" href="/asterlite/pwa-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/asterlite/pwa-icon.svg" />
    <title>Asterlite</title>
    <script type="module" crossorigin src="/asterlite/assets/index-CTPy-aMH.js"></script>
    <link rel="stylesheet" crossorigin href="/asterlite/assets/index-D9Y8y_Uq.css">
  </head>
  <body>
    <div id="app">
      <div id="game-root"></div>
      <div id="death-fade" aria-hidden="true"></div>
      <div id="low-hp-veil" aria-hidden="true"></div>
      <section id="boss-health" class="boss-health is-hidden" aria-label="Boss health">
        <div class="boss-health__header">
          <strong id="boss-health-name">Boss</strong>
          <span id="boss-health-value">0 / 0 HP</span>
        </div>
        <div class="boss-health__bar" aria-hidden="true">
          <span id="boss-health-progress"></span>
          <i class="boss-health__gate"></i>
        </div>
        <small id="boss-health-mode" class="boss-health__mode" hidden></small>
      </section>
      <section id="main-menu" class="main-menu" aria-live="polite">
        <div class="main-menu__panel">
          <p id="main-menu-language-label" class="main-menu__kicker">Language</p>
          <p id="main-menu-subtitle" class="main-menu__subtitle">Choose your language.</p>
          <div class="main-menu__languages" role="group" aria-label="Language">
            <button class="main-menu__language" type="button" data-language="pt-BR">Português</button>
            <button class="main-menu__language" type="button" data-language="en-US">English</button>
          </div>
          <button id="main-menu-start" class="main-menu__start" type="button">Start Run</button>
        </div>
        <div class="main-menu__warp" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
      </section>
      <button class="settings-toggle" id="settings-toggle" type="button" aria-label="Open settings" aria-expanded="false" data-ui-icon="settings"></button>
      <div id="hud">
        <section class="hud-panel hud-panel--left">
          <div class="money-readout">
            <span id="money-kicker" class="sr-only">Money</span>
            <span class="resource-readout"><span data-ui-icon="coins" aria-hidden="true"></span><span id="money" class="hud-value">$0</span></span>
            <span class="resource-readout resource-readout--crystals"><span data-ui-icon="gem" aria-hidden="true"></span><span id="crystals" class="hud-crystals">0</span></span>
          </div>
          <div id="hp-meter" class="hp-meter" role="meter" aria-label="Ship hull" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
            <span class="hp-meter__icon" data-ui-icon="heart" aria-hidden="true"></span>
            <span id="hp" class="hp-meter__text">100 / 100</span>
            <span class="hp-meter__track" aria-hidden="true"><span class="hp-meter__fill"></span></span>
          </div>
          <div id="ship-xp-meter" class="ship-xp-meter" aria-label="Ship level progress">
            <span id="ship-level" class="ship-xp-meter__level">Lv 1</span>
            <span class="ship-xp-meter__track" aria-hidden="true">
              <span class="ship-xp-meter__fill"></span>
            </span>
          </div>
        </section>
        <div id="reward-feed" aria-live="polite"></div>
        <section id="survival-hud" class="survival-hud is-hidden" aria-label="Survival status">
          <div class="survival-timer">
            <span>Survival</span>
            <strong id="survival-timer">0:00</strong>
            <small>Best <b id="survival-best">0:00</b></small>
          </div>
          <div class="survival-threat">
            <span class="survival-threat__label">Threat</span>
            <div class="survival-threat__track" aria-hidden="true">
              <span id="survival-threat-fill" class="survival-threat__fill"></span>
            </div>
            <strong id="survival-threat">1</strong>
          </div>
        </section>
        <section id="first-warp-goal" class="first-warp-goal is-hidden" aria-label="Current objective">
          <div class="first-warp-goal__body">
            <span class="first-warp-goal__kicker">Next</span>
            <strong id="first-warp-goal-title">Draw out the gate boss</strong>
          </div>
          <div class="first-warp-goal__progress" aria-hidden="true">
            <span id="first-warp-goal-progress"></span>
          </div>
          <span id="first-warp-goal-progress-text" class="first-warp-goal__progress-text">0/0</span>
        </section>
        <div class="hud-right-cluster">
          <button class="route-toggle is-hidden" id="route-toggle" type="button" aria-label="Travel to next zone" disabled>
            <span class="route-toggle__icon" data-ui-icon="route" aria-hidden="true"></span>
            <span id="route-target" class="route-toggle__label">Route</span>
          </button>
        </div>
      </div>
      <div id="idle-dock" aria-label="Idle systems">
        <button class="shop-drawer-backdrop is-hidden" id="shop-drawer-backdrop" type="button" aria-label="Close shop"></button>
        <section class="shop-panel is-hidden" id="shop-panel" aria-live="polite">
          <button class="shop-drawer-handle" id="shop-drawer-handle" type="button" aria-label="Close shop"></button>
          <div class="shop-heading">
            <div>
              <div class="hud-kicker" id="shop-kicker">Upgrades</div>
              <h2 id="shop-title">Ore Refinery</h2>
            </div>
            <button class="shop-close" id="shop-close" type="button" aria-label="Close shop" data-ui-icon="close"></button>
          </div>
          <p id="shop-copy" class="shop-copy">Convert asteroid dust into steady background credits.</p>
          <div class="shop-stats" id="shop-stats"></div>
          <div class="shop-actions" id="shop-actions"></div>
        </section>
      </div>
      <div id="ui-modal" class="ui-modal is-hidden" aria-hidden="true">
        <div id="ui-modal-backdrop" class="ui-modal__backdrop"></div>
        <section id="ui-modal-panel" class="ui-modal__panel" role="dialog" aria-modal="true" aria-labelledby="ui-modal-title">
          <button class="ui-modal__handle" type="button" aria-label="Close modal"></button>
          <header class="ui-modal__header">
            <div>
              <div class="hud-kicker" id="ui-modal-kicker">Info</div>
              <h2 id="ui-modal-title">Details</h2>
              <p id="ui-modal-copy" class="ui-modal__copy"></p>
            </div>
            <button id="ui-modal-close" class="ui-modal__close" type="button" aria-label="Close modal" data-ui-icon="close"></button>
          </header>
          <div id="ui-modal-body" class="ui-modal__body"></div>
        </section>
      </div>
      <div id="priority-popup" class="priority-popup is-hidden" aria-hidden="true">
        <section class="priority-popup__panel" role="dialog" aria-modal="true" aria-labelledby="priority-popup-title">
          <span id="priority-popup-kicker" class="priority-popup__kicker">Route updated</span>
          <h2 id="priority-popup-title">Zone unlocked</h2>
          <p id="priority-popup-copy">A new route is available on the map.</p>
          <button id="priority-popup-ok" class="priority-popup__ok" type="button">OK</button>
        </section>
      </div>
    </div>
  </body>
</html>
